<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episcopal Compass</title>
  <link rel="icon" href="img/compass-rose-tec.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/settings.js"></script>
  <script src="js/nav.js"></script>
</head>
<body class="app">
  <a class="skip" id="skip" href="#map">Skip to results</a>
  <header>
    <button type="button" id="menu-btn" class="menu-btn" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="5" r="2"></circle><circle cx="12" cy="5" r="2"></circle><circle cx="19" cy="5" r="2"></circle>
        <circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle>
        <circle cx="5" cy="19" r="2"></circle><circle cx="12" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle>
      </svg>
    </button>
    <div class="brand">
      <img class="logo" src="img/compass-rose-tec.svg" alt="" width="28" height="28">
      <h1>Episcopal Compass</h1>
    </div>
    <nav id="site-nav" aria-label="Site">
      <div class="nav-title" aria-hidden="true">Episcopal Compass</div>
      <a aria-current="page" href="index.html">Directory</a>
      <a id="office-link" href="https://prayer.forwardmovement.org/pray" target="_blank" rel="noopener">Daily Office Readings</a>
      <a href="about.html">About</a>
      <a href="acknowledgements.html">Acknowledgements</a>
    </nav>
    <div class="view-toggle" id="view-toggle">
      <span id="view-list" aria-hidden="true">List</span>
      <button type="button" id="view-switch" role="switch" aria-checked="true" aria-label="Map view"></button>
      <span id="view-map" class="on" aria-hidden="true">Map</span>
    </div>
  </header>
  <main class="layout" id="layout" data-view="map">
    <aside class="filters" aria-label="Filters">
      <label for="q">Search</label>
      <input id="q" placeholder="Search for a specific parish">
      <label for="origin">ZIP Code or City, State</label>
      <input id="origin">
      <button type="button" id="apply-origin">Sort by Distance</button>
      <button type="button" id="use-location" hidden>Use my Location</button>
      <label for="f-state">State</label>
      <div class="ms" data-id="f-state"></div>
      <label for="f-diocese">Diocese</label>
      <div class="ms" data-id="f-diocese"></div>
      <label for="f-churchmanship">Churchmanship</label>
      <div class="ms" data-id="f-churchmanship"></div>
      <label for="f-wo-serve">Female Clergy</label>
      <div class="ms" data-id="f-wo-serve"></div>
      <label for="f-wo-affirmed">Affirmation of Women’s Ordination</label>
      <div class="ms" data-id="f-wo-affirmed"></div>
      <label for="f-lgbt-serve">LGBT Clergy</label>
      <div class="ms" data-id="f-lgbt-serve"></div>
      <label for="f-lgbt-affirmed">Affirmation of LGBT Ordination</label>
      <div class="ms" data-id="f-lgbt-affirmed"></div>
      <label for="f-ssm">Same-Sex Marriage</label>
      <div class="ms" data-id="f-ssm"></div>
      <label for="f-spectrum">Theological & Cultural Alignment</label>
      <div class="ms" data-id="f-spectrum"></div>
      <label for="f-verified">Verification Status</label>
      <div class="ms" data-id="f-verified"></div>
      <button type="button" id="reset">Clear filters</button>
      <p id="status" role="status"></p>
      <p class="copyright">© 2026 Tyler Jornov</p>
    </aside>
    <section class="list" id="list" aria-label="Results" tabindex="-1"></section>
    <div id="map" role="region" aria-label="Map of parishes"></div>
  </main>
  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <div class="detail-head">
      <div>
        <h2 id="detail-title"></h2>
        <div class="meta" id="detail-meta"></div>
      </div>
      <button type="button" id="detail-close" class="detail-close" aria-label="Close">
        <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
