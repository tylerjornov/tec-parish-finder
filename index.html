<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEC Parish Directory</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/settings.js"></script>
  <script src="js/nav.js"></script>
</head>
<body class="app">
  <a class="skip" id="skip" href="#list">Skip to results</a>
  <header>
    <button type="button" id="menu-btn" class="menu-btn" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="5" r="2"></circle><circle cx="12" cy="5" r="2"></circle><circle cx="19" cy="5" r="2"></circle>
        <circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle>
        <circle cx="5" cy="19" r="2"></circle><circle cx="12" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle>
      </svg>
    </button>
    <h1>TEC Parish Directory</h1>
    <nav id="site-nav" aria-label="Site">
      <div class="nav-title" aria-hidden="true">TEC Parish Directory</div>
      <a aria-current="page" href="index.html">Directory</a>
      <a href="about.html">About</a>
    </nav>
    <div class="view-toggle">
      <span id="view-list" class="on" aria-hidden="true">List</span>
      <button type="button" id="view-switch" role="switch" aria-checked="false" aria-label="Map view"></button>
      <span id="view-map" aria-hidden="true">Map</span>
    </div>
  </header>
  <main class="layout" id="layout" data-view="list">
    <aside class="filters" aria-label="Filters">
      <label for="q">Search</label>
      <input id="q" placeholder="Name, city, notes">
      <label for="origin">Near (address, city ST, or lat,lon)</label>
      <input id="origin" placeholder="Sumter, SC">
      <button type="button" id="apply-origin">Sort by closest</button>
      <label for="f-state">State</label>
      <select id="f-state"><option value="">Any</option></select>
      <label for="f-diocese">Diocese</label>
      <select id="f-diocese"><option value="">Any</option></select>
      <label for="f-churchmanship">Churchmanship</label>
      <select id="f-churchmanship"><option value="">Any</option></select>
      <label for="f-wo-serve">Women serve as priests here</label>
      <select id="f-wo-serve"><option value="">Any</option></select>
      <label for="f-wo-affirmed">Women’s ordination affirmed</label>
      <select id="f-wo-affirmed"><option value="">Any</option></select>
      <label for="f-lgbt-serve">LGBT people serve as priests here</label>
      <select id="f-lgbt-serve"><option value="">Any</option></select>
      <label for="f-lgbt-affirmed">LGBT ordination affirmed</label>
      <select id="f-lgbt-affirmed"><option value="">Any</option></select>
      <label for="f-ssm">Same-sex marriage</label>
      <select id="f-ssm"><option value="">Any</option></select>
      <label for="f-spectrum">Spectrum</label>
      <select id="f-spectrum"><option value="">Any</option></select>
      <label for="f-verified">Verification</label>
      <select id="f-verified">
        <option value="">Any</option>
        <option>Website Only</option>
        <option>Unverified</option>
        <option>Verified</option>
      </select>
      <button type="button" id="reset">Clear filters</button>
      <p id="status" role="status"></p>
    </aside>
    <section class="list" id="list" aria-label="Results" tabindex="-1"></section>
    <div id="map" role="region" aria-label="Map of parishes"></div>
  </main>
  <footer>
    © 2026 Tyler Jornov. <a href="about.html#terms">Terms and Conditions</a>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
