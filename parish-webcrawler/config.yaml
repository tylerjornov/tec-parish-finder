# =====================================================================================================
#  config.yaml  -  advanced settings. You normally never need to edit this file.
# =====================================================================================================
#  * Lines that start with # are notes for you; the tool ignores them.
#  * Settings look like   name: value   . Keep the colon and the space after it.
#  * Indentation matters. Use SPACES (never the Tab key). If a setting has things indented under it,
#    keep them lined up exactly as they are now.
#  * If you break something, the tool tells you in plain words which line to fix.
#
#  The parish JSON file is chosen each time you run run.command. If its columns are named differently,
#  change the first block ("Your data") and the `fields:` table.
# =====================================================================================================


# -----------------------------------------------------------------------------------------------------
# 1. YOUR DATA
# -----------------------------------------------------------------------------------------------------
output_dir: output             # where the results file goes (created for you)

id_key: id                     # which JSON key uniquely names a parish (used in the results)
name_key: name                 # which key holds the parish name
website_key: website           # which key holds the web address to check (church site, Facebook, or Asset Map)

# A value counts as MISSING when it is empty/null or exactly one of these (capitals don't matter).
missing_markers:
  - ""
  - "N/A - Data Not Available"
  - "N/A"

# A value that means "we checked: there is none" (capitals don't matter). It is not missing: it matches a website
# that names none either, and is reported "Different on website" (note: JSON says confirmed none) if the site
# names one. A single field can add its own words with  confirmed_none:  in the fields table below.
confirmed_none_markers:
  - "None - No Rector"

# Keys listed here are never checked. They are copied to the reports as NOT_CHECKABLE and left untouched.
uncheckable_fields:
  - id
  - lat
  - lon
  - asa
  - notes
  - verification_status
  - date_last_updated


# -----------------------------------------------------------------------------------------------------
# 2. THE AI MODEL  (runs on your Mac through Ollama - free, private, no internet needed for the AI)
# -----------------------------------------------------------------------------------------------------
model: qwen2.5:3b              # small enough for an 8 GB Mac, and the most accurate small model tested (Oct 2026).
                               # Also installed: qwen3.5:2b-q4_K_M (about 10% faster, slightly sloppier),
                               # qwen2.5:1.5b and qwen3.5:0.8b (faster, but they mix up clergy and invent services),
                               # llama3.2:3b  granite4.2:3b  phi4-mini   (change the name, save, run again)
ollama_url: http://localhost:11434
ollama_num_ctx: 6144           # how much text the model reads at once. Lower (4096) = less memory.
ollama_timeout_seconds: 300    # give up on one model answer after this many seconds

max_chars_per_chunk: 3500      # most page text sent to the model in one question (one question per group of fields per site)
context_lines: 1               # with each line that has a keyword, also show this many lines before and after it
max_llm_pages_per_group: 6     # for each group of fields, take lines from at most this many of the site's best pages.
                               # Lower = faster but may miss things. Higher = slower but more thorough.


# -----------------------------------------------------------------------------------------------------
# 3. CRAWLING (how websites are read)
# -----------------------------------------------------------------------------------------------------
max_pages_per_site: 40         # most pages downloaded per website (the home page is always included)
max_crawl_depth: 3             # when following links (no sitemap), how many clicks deep to go
delay_seconds: 1               # pause between two requests to the same website (be polite: keep >= 1)
fetch_concurrency: 4           # how many DIFFERENT websites are downloaded at the same time
respect_robots: true           # obey each site's robots.txt. Leave this on.
use_browser_fallback: true     # use a hidden Chrome (Playwright) for pages that show almost no text
min_text_chars_before_browser: 250   # a page with less text than this triggers the hidden browser
cache_max_age_days: 14         # downloaded pages are remembered this long so re-runs are quick

# "12h" prints times like 8:30 AM and 12:00 noon.  "24h" prints 08:30 and 12:00.
time_format: 12h

# How we introduce ourselves to websites. Please keep it honest.
user_agent: "Mozilla/5.0 (compatible; ParishInfoVerifier/1.0; personal low-volume parish data check; respects robots.txt)"

# Web addresses that are never read (social media, maps). A record whose website is one of these is
# reported UNCLEAR ("cannot be read").  Facebook and the Asset Map have their own rules below.
skip_domains:
  - instagram.com
  - twitter.com
  - x.com
  - linkedin.com
  - tiktok.com
  - youtube.com
  - yelp.com
  - maps.google.com
  - goo.gl
  - pinterest.com

# Websites shared by many parishes (a diocese's, a college's). A parish whose address is on one of these - or any
# address with a path after the domain, like diocese.org/st-davids - is read narrowly: its own page, the pages
# below it, and at most 3 pages it links to. Otherwise the page limit gets used up on staff and finance pages.
shared_host_domains:
  - episcopalchurchsc.org      # The Episcopal Church in South Carolina
  - edusc.org                  # The Diocese of Upper South Carolina
  - voorhees.edu               # Voorhees University (St. Philip's)

# Links to these sites on a church page are treated as possible livestream links.
livestream_hosts:
  - youtube.com
  - youtu.be
  - facebook.com
  - fb.watch
  - zoom.us
  - boxcast.com
  - online.church
  - vimeo.com
  - livestream.com
  - restream.io
  - resi.io
  - churchstreaming.tv
  - subsplash.com

# Web-address "traps": pages that go on forever (calendars, archives) or are useless (logins, carts).
# These are regular expressions; any address matching one is skipped.
exclude_patterns:
  - '/(?:19|20)\d{2}/(?:0?[1-9]|1[0-2])(?:/|$)'                 # date archives: /2024/03/ and dated blog posts
  - '/(?:calendar|calendars|ical|events?-calendar)(?:/|$|\?)'    # calendars
  - '/events?/(?:\d{4}|list|month|week|day|today|category|tag)'  # event-calendar views
  - '/event/'                                                    # single event pages
  - '/(?:tag|tags|category|categories|author|authors)(?:/|$)'    # blog tag / category / author pages
  - '/(?:feed|feeds|rss|atom|wp-json|wp-admin|wp-login|xmlrpc)(?:/|$|\.php|\?)'   # feeds and WordPress back-end
  - '/(?:login|log-in|signin|sign-in|logout|register|signup|sign-up|account|my-account|password)(?:/|$|\?)'
  - '/(?:cart|checkout|basket|shop|store|product|products|wishlist)(?:/|$|\?)'
  - '/(?:page|paged)/\d+'                                        # "page 2, page 3..." of a list
  - '/(?:search|attachment|trackback|embed|print|comments?)(?:/|$|\?)'
  - '[?&](?:s|ical|outlook-ical|tribe-bar-date|eventDisplay|replytocom|share|print|format|orderby)='
  - '/cdn-cgi/'
  - '\.(?:xml|rss|atom)(?:$|\?)'

# Pages whose address or link text contains these words are downloaded first (so the page limit keeps the
# most useful pages). Lower-case, partial words are fine.
priority_keywords:
  - worship
  - services
  - visit
  - new
  - welcome
  - about
  - contact
  - staff
  - clergy
  - ministries
  - children
  - youth
  - formation
  - music
  - parking
  - access
  - live
  - stream
  - give
  - beliefs
  - inclusion
  - welcoming
  # a few extras that help on many church sites:
  - location
  - directions
  - sunday
  - who-we-are
  - leadership
  - rector


# -----------------------------------------------------------------------------------------------------
# 4. SPECIAL SOURCES  (Facebook and the Episcopal Asset Map are handled differently from church sites)
# -----------------------------------------------------------------------------------------------------
source_priority:               # when two sources disagree, the one listed FIRST wins
  - own_site                   #   the church's own website
  - facebook
  - asset_map

special_sources:
  facebook.com:
    # best_effort = look at public pages while logged out, very gently.  skip = never touch Facebook.
    # The tool NEVER logs in, NEVER solves CAPTCHAs and stops at any login wall.
    mode: best_effort
    max_pages: 5               # at most this many Facebook pages per parish
    delay_seconds: 5           # wait this long between Facebook pages
    max_post_age_days: 365     # ignore posts older than this unless nothing newer exists
    llm_groups: [services, community, identity]   # which field groups to ask the model about on Facebook text

  episcopalassetmap.org:
    # LOWER-TRUST source. Its "Contact" person is often diocesan staff (e.g. Canon to the Ordinary), so the
    # contact only counts as the rector when the listed title is Rector, Vicar, Priest-in-Charge, Dean or
    # Interim Rector.
    mode: fetch
    delay_seconds: 2
    never_paths:               # parts of this site the tool must NEVER touch (patterns on the page address)
      - '^/maps?(/|$|\?)'
      - '^/search'
      - '^/user'
      - '^/admin'
      - '^/node/[^/]+/edit'
    llm_groups: [services, community]


# -----------------------------------------------------------------------------------------------------
# 5. THE FIELDS TABLE  (what to check, and how)
# -----------------------------------------------------------------------------------------------------
# Each field has:
#   key          the exact JSON key in your file
#   type         how values are compared:
#                  phone     last 10 digits must match            email   any email on the site may match
#                  url       web addresses (ignoring http/www)    address street number + street name (+city/state)
#                  person    surname + role (Rector, Vicar...)    services  a set of day + time pairs
#                  list      ";"-separated items, fuzzy matched   text    like list, but a single value
#                  rite      "I", "II" or "Mixed" (worked out by code from the services text)
#   description  one plain sentence (keep it inside the quotes; a colon inside quotes is fine). For model-read fields this is what the model is told to look for.
#   group        which batch of fields is asked together (see "Groups" below). "contact" = found by rules, no AI.
#   Optional:  format (style hint for the model), role (church|rector, phones/emails), address_part (city|state),
#              default_day (services: the day to assume when none is written), url_kind (website|livestream),
#              confirmed_none (values meaning "there is none" for this field), lookup (compare with a table in this
#              file instead of the websites), default_value + default_unless (assume this value unless a page has one
#              of these words; the model is then not asked)
#
# Keys not listed here (and not in uncheckable_fields) are NOT checked. They are copied through untouched.
# That is why churchmanship, female_clergy, ssm and the other opinion-type columns are absent: this tool only
# checks facts a website states plainly (names, addresses, phones, emails, service times, clergy...).

fields:
  # ---- identity (asked of the model) ----
  - key: name
    type: text
    group: identity
    description: "The full official name of this parish or church, as it names itself."
    format: The name as printed on the page (for example "St. Name's Episcopal Church"). No slogans.

  # ---- contact (found by rules: phone/email/link/address patterns, no AI) ----
  - key: website
    type: url
    group: contact
    url_kind: website
    description: "The church's own website address."
  - key: address
    type: address
    group: contact
    description: "The street address of the church building."
  - key: city
    type: text
    group: contact
    address_part: city
    description: "City, taken from the street address."
  - key: state
    type: text
    group: contact
    address_part: state
    description: "State, taken from the street address (two-letter code)."
  - key: church_phone
    type: phone
    group: contact
    role: church
    description: "The church office's main phone number."
  - key: church_email
    type: email
    group: contact
    role: church
    description: "The church office's main email address."
  - key: rector_email
    type: email
    group: contact
    role: rector
    description: "The rector's (or vicar's / priest's) own email address."
  - key: rector_phone
    type: phone
    group: contact
    role: rector
    description: "The rector's (or vicar's / priest's) own phone number."
  - key: livestream_url
    type: url
    group: contact
    url_kind: livestream
    description: "A link where services are livestreamed."

  # ---- clergy (asked of the model) ----
  - key: rector_name
    type: person
    group: clergy
    role: rector
    description: "The parish's lead priest (Rector, Vicar, Priest-in-Charge, Interim Rector or Dean)."
    format: 'Title and full name only, with no role after it (for example "The Rev. Full Name"). Use the title the page uses, written as The Rev., The Very Rev., Fr. or Mtr.; keep Dr. and Canon when printed.'
  - key: other_clergy
    type: list
    group: clergy
    description: "Clergy serving at this parish other than the rector: associate and assistant priests, curates, deacons, priests associate."
    format: 'People separated by "; ". Each = title and full name, then the role in parentheses (for example "The Rev. Full Name (Associate Rector)"). Titles are written The Rev., The Very Rev., Fr. or Mtr.; keep Dr. and Canon when printed. Never include the rector, the bishop, or lay staff.'
  - key: diocesan_bishop
    type: person
    group: lookup
    lookup: diocese              # not read from websites: compared with diocese_lookup (below) for the record's diocese
    description: "The bishop of this parish's diocese."

  # ---- services (asked of the model) ----
  - key: sunday_services
    type: services
    group: services
    default_day: sun
    description: "Regular Sunday worship services that are in effect now."
    format: 'Items separated by "; " and ordered by time. Each item = time first (8:30 AM, 12:00 noon), then the service name, then ", Rite I" or ", Rite II" only if the page says so, then extras in parentheses such as (spoken), (livestreamed), (Spanish), (chapel). Put seasonal changes in parentheses like (Sept–May).'
  - key: weekday_services
    type: services
    group: services
    confirmed_none: ["N/A"]      # "N/A" here means Sunday services only: it matches a site that lists no weekday services
    description: "Regular services Monday through Saturday that are in effect now."
    format: 'Items separated by "; ". Each item starts with an abbreviated day (Mon, Tue, Wed, Thu, Fri, Sat) or an ordinal plus day (3rd Wed), then the time, then the service name, then ", Rite I/II" if stated, then extras in parentheses. Use ranges like Mon–Fri when days share a time. Never include Sunday services.'
  - key: service_languages
    type: list
    group: services
    description: "The languages in which services are held."
    format: 'Languages separated by "; ". Add details in parentheses only when stated.'
    default_value: English       # when no page names another language, "English" is assumed and the model is not asked
    default_unless: [spanish, español, espanol, "en español", misa, bilingual, latino, hispanic, korean, chinese, mandarin,
                     cantonese, vietnamese, french, français, haitian, creole, kreyòl, portuguese, german, tagalog, filipino,
                     japanese, swahili, arabic, sudanese, dinka, burmese, hmong, russian, ukrainian, "sign language"]
  - key: rite_details
    type: rite
    group: services
    description: "Which Prayer Book rites are used and when, e.g. Rite I (8:00 AM); Rite II (10:30 AM). Worked out by the program from the services text (not asked of the model)."
  - key: rite
    type: rite
    group: services
    description: "I, II or Mixed. Worked out by the program from the services text (not asked of the model)."

  # ---- community (asked of the model) ----
  - key: music_style
    type: text
    group: community
    description: "The style of music at worship (choir, organ, hymns, bands...)."
    format: 'A short fragment: kinds of music, then instruments or leaders. No marketing language.'
  - key: childcare
    type: list
    group: community
    description: "Childcare, nursery, and children's programs during services."
    format: 'Items separated by "; ", each a short fragment, with ages and times only if stated.'
  - key: formation
    type: list
    group: community
    description: "Christian formation: adult and children's education, Bible studies, forums, classes."
    format: 'Items separated by "; ", each a short fragment, with day and time only if stated.'

  # ---- facilities (asked of the model) ----
  - key: parking
    type: text
    group: facilities
    description: "Parking available for visitors."
    format: 'A short fragment such as "Parking lot on site".'
  - key: accessibility
    type: text
    group: facilities
    description: "Accessibility for people with disabilities (ramps, elevators, hearing loops, accessible restrooms)."
    format: 'A short fragment such as "Handicapped-accessible facilities".'

# other_contact is not checked: it is built from church_phone and church_email, which are checked themselves.


# Which fields are built in code from other fields.
derived_fields:
  rite_details:                # "Rite I (8:00 AM); Rite II (10:30 AM)" from the services text
    details_from_services: [sunday_services, weekday_services]
  rite:                        # Rite I -> "I", Rite II -> "II", both -> "Mixed", neither -> nothing
    from_services: [sunday_services, weekday_services]

# The current bishop of each diocese. diocesan_bishop is compared with this table (using the record's diocese), not
# read from websites. Keep it up to date when a new bishop is consecrated. Names are compared by surname and first name.
diocese_lookup:
  Upper South Carolina: The Rt. Rev. Daniel P. Richards
  South Carolina: The Rt. Rev. Ruth Woodliff-Stanley

# -----------------------------------------------------------------------------------------------------
# 6. GROUPS  (fields asked together, and the words that make a page worth asking about)
# -----------------------------------------------------------------------------------------------------
# For each group the program first looks for these keywords on each page. A page with none of them is
# skipped. The model sees only the lines with these words (numbered, repeats removed), never whole pages,
# and is asked once per group per site.
#   keywords   words/prefixes (lower case). "re:..." is a regular expression.
#   url_hints  words in a page's address/title that make it a better page for this group (first = best)
#   instructions  extra guidance added to the model's prompt for this group
#   max_pages     take lines from at most this many pages for this group (default: max_llm_pages_per_group)
#   check_evidence_keywords  (default true) the lines the model cites must contain one of the group's keywords
groups:
  clergy:
    max_pages: 3
    keywords: [rector, vicar, priest, rev., reverend, "the rev", father, fr., dean, canon, pastor, clergy, deacon, mother, "our staff", leadership]
    url_hints: [staff, clergy, leadership, who-we-are, ministers, our-team, about, contact, rector]
    instructions: >
      Find the parish's lead priest (Rector, Vicar, Priest-in-Charge, Interim Rector or Dean). Do not report
      assistants, curates, deacons, wardens, office staff or the diocese's bishop as the rector.
  services:
    keywords: [sunday, eucharist, mass, communion, service, worship, evensong, "morning prayer", "evening prayer", compline, rite, "a.m.", "p.m.", noon, spanish, español, bilingual, language, livestream, 're:\d{1,2}(?::\d{2})?\s?[ap]\.?m\b']
    url_hints: [worship, services, service, sunday, visit, new, welcome, schedule, liturgy, plan]
    instructions: >
      Put Sunday services in sunday_services and services on Monday through Saturday in weekday_services.
      Report only regular, recurring services currently in effect (not one-time events or past dates).
  community:
    max_pages: 4
    keywords: [music, choir, organ, organist, hymn, choral, anthem, band, praise, childcare, nursery, children, kids, youth, "sunday school", formation, "bible study", "adult forum", catechesis, "godly play", "small group", rosary, education]
    url_hints: [music, choir, children, youth, formation, education, ministries, adults, families, community]
    instructions: >
      Describe what the parish itself offers regularly. Ignore programs of other organizations.
  facilities:
    max_pages: 3
    keywords: [parking, park, accessib, wheelchair, handicap, ramp, elevator, hearing, disab, mobility, restroom]
    url_hints: [visit, parking, access, directions, location, plan, new, about, contact]
    instructions: >
      Report only facts about THIS church's building and grounds.
  identity:
    max_pages: 2
    keywords: [episcopal, anglican, parish, church, chapel, cathedral, "welcome to", "about us"]
    url_hints: [about, who-we-are, welcome, history, beliefs]
    instructions: >
      Report the church's own name. Not the diocese, not the national church, not a web designer. If the name is
      not stated plainly, answer unclear.


# The example answers for the model (FORMAT ONLY) live in this file:
style_example_file: style_example.json
